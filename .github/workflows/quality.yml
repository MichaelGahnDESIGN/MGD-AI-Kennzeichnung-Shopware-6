name: Qualität und Shopware-Kompatibilität

on:
    push:
    pull_request:

# Standardmäßig sind alle Jobs nur lesend. Ausschließlich der Release-Job
# erhält nach bestandenen Prüfungen Schreibrecht; Fork-PRs bleiben lesend.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secret-scan:
        name: Geheimnisscan
        # Der öffentliche Quellcode benötigt keine Server-Secrets. GitHub-gehostete
        # Runner halten die Qualitätsprüfung auch ohne eigenen Online-Runner lauffähig.
        runs-on: ubuntu-latest
        steps:
            - name: Quellcode sicher auschecken
              # Quelle: https://github.com/actions/checkout/releases/tag/v7.0.1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Go einrichten
              # Quelle: https://github.com/actions/setup-go/releases/tag/v6.5.0
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
              with:
                  go-version: '1.25.x'
                  cache: false

            - name: Gitleaks in fester Version installieren
              # Der offizielle Repository-Umzug behält diesen Go-Modulpfad bei.
              # Quelle: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
              run: |
                  go install github.com/zricethezav/gitleaks/v8@v8.30.1
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Git-Historie und Arbeitsbaum auf Geheimnisse prüfen
              run: |
                  gitleaks git . --no-banner --redact
                  gitleaks dir . --no-banner --redact --max-target-megabytes=5

    quality:
        name: Shopware ${{ matrix.shopware }} / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shopware: ['6.6.10', '6.7']
                php: ['8.2', '8.4']

        steps:
            - name: Quellcode sicher auschecken
              # Quelle: https://github.com/actions/checkout/releases/tag/v7.0.1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: PHP einrichten
              # Quelle: https://github.com/shivammathur/setup-php/releases/tag/2.35.5
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, intl, json, mbstring, zip
                  coverage: none
                  tools: composer:v2

            - name: Node.js einrichten
              # Quelle: https://github.com/actions/setup-node/releases/tag/v6.5.0
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: '24.x'

            - name: Go einrichten
              # Quelle: https://github.com/actions/setup-go/releases/tag/v6.5.0
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
              with:
                  go-version: '1.25.x'
                  cache: false

            - name: Composer-Metadaten prüfen
              run: composer validate --strict

            - name: Dokumentierte Shopware-Prüfversionen installieren
              shell: bash
              run: |
                  # Die Quellcode-Vertragstests prüfen exakt diese dokumentierten Tags.
                  case "${{ matrix.shopware }}" in
                      '6.6.10') shopware_constraint='6.6.10.27' ;;
                      '6.7') shopware_constraint='6.7.14.2' ;;
                      *) echo 'Unbekannte Shopware-Linie.' >&2; exit 1 ;;
                  esac
                  composer config platform.php "${{ matrix.php }}"
                  # Shopware 6.7.13.0 erzwingt derzeit mcp/sdk ^0.6. Diese
                  # Testabhängigkeit wird nicht mit dem Plugin ausgeliefert und
                  # das Plugin verwendet weder MCP noch den betroffenen SSE-
                  # Transport. Nur dieser eine dokumentierte Upstream-Hinweis
                  # wird bis zu einer kompatiblen Shopware-Version akzeptiert.
                  if [[ "${{ matrix.shopware }}" == '6.7' ]]; then
                      composer config --json audit.ignore \
                          '{"PKSA-p9gd-j6gr-6f9t":"Shopware 6.7.13.0 erzwingt mcp/sdk ^0.6; das Plugin verwendet MCP/SSE nicht und liefert vendor nicht aus."}'
                  fi
                  composer require --no-update \
                      "shopware/core:${shopware_constraint}" \
                      "shopware/storefront:${shopware_constraint}"
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
              run: composer audit --locked --no-interaction

            - name: PHP-Unit-Tests ohne Datenbank ausführen
              run: composer test:unit

            - name: PHPStan ausführen
              run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=1G

            - name: PHP-Code-Stil prüfen
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Administration headless testen
              run: npm run test:administration

            - name: Storefront headless testen
              run: npm run test:storefront

            - name: JSON und XML prüfen
              shell: bash
              run: |
                  while IFS= read -r -d '' json_file; do
                      jq empty "${json_file}"
                  done < <(find src/Resources -type f -name '*.json' -print0)
                  while IFS= read -r -d '' xml_file; do
                      php -r '$document = new DOMDocument(); exit($document->load($argv[1]) ? 0 : 1);' "${xml_file}"
                  done < <(find src/Resources -type f -name '*.xml' -print0)

            # Die Matrix darf das veröffentlichte Plugin-Paket nicht auf eine
            # einzelne Prüfversion oder PHP-Nebenversion verengen.
            - name: Veröffentlichbare Composer-Metadaten wiederherstellen
              run: git restore --source=HEAD -- composer.json composer.lock

            # Ein unversioniertes Laufzeit- oder Dokumentationsobjekt könnte
            # sonst über die Positivliste unbemerkt in das ZIP gelangen.
            # Ignorierte Abhängigkeiten und dist bleiben bewusst unberücksichtigt.
            - name: Release-Quellstand vollständig sauber prüfen
              if: matrix.shopware == '6.7' && matrix.php == '8.4'
              run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

            # Die vollständige Datei prüft auch Paketinhalt, Symlink-Abwehr und
            # Reproduzierbarkeit. Danach wird das finale ZIP bewusst neu gebaut.
            - name: Vollständigen Release-Strukturvertrag prüfen
              if: matrix.shopware == '6.7' && matrix.php == '8.4'
              run: vendor/bin/phpunit --fail-on-skipped tests/Structure/DocumentationAndReleaseTest.php

            # Nur der neueste Matrixlauf baut das tatsächlich auslieferbare
            # Paket. Pull Requests dürfen es prüfen, aber nie veröffentlichen.
            - name: Release-ZIP reproduzierbar bauen
              if: matrix.shopware == '6.7' && matrix.php == '8.4'
              run: bash scripts/build-release.sh

            - name: Shopware CLI in fester Version installieren
              if: matrix.shopware == '6.7' && matrix.php == '8.4'
              # Offizielle Installation: https://github.com/shopware/shopware-cli#install
              # Verwendete Version: https://github.com/shopware/shopware-cli/releases/tag/0.15.12
              run: |
                  go install github.com/shopware/shopware-cli@0.15.12
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            # Validiert bewusst das identische ZIP, das anschließend als
            # Artefakt bereitgestellt wird, nicht einen abweichenden Quellbaum.
            - name: Ausgeliefertes Shopware-Erweiterungspaket validieren
              if: matrix.shopware == '6.7' && matrix.php == '8.4'
              run: shopware-cli --no-interaction extension validate dist/MGDAIImageLabels-0.1.7.zip

    built-assets:
        name: Fertige Oberflächen frisch bauen und prüfen
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: '22'
            - name: Shopware CLI 0.15.12 mit Prüfsumme installieren
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p /tmp/mgd-cli
                  gh release download 0.15.12 --repo shopware/shopware-cli --pattern shopware-cli_Linux_x86_64.tar.gz --pattern checksums.txt --dir /tmp/mgd-cli
                  cd /tmp/mgd-cli
                  grep '  shopware-cli_Linux_x86_64.tar.gz$' checksums.txt | sha256sum -c -
                  tar -xzf shopware-cli_Linux_x86_64.tar.gz
            - name: Paketstand und frischen Build prüfen
              run: |
                  python3 scripts/build-assets.py --check
                  python3 scripts/build-assets.py --cli /tmp/mgd-cli/shopware-cli
                  node --test tests/Administration/built-assets.test.mjs
                  git diff --exit-code -- src/Resources/public

    release:
        name: Geprüftes ZIP veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [secret-scan, quality, built-assets]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Paket aus geprüften Assets erstellen
              run: bash scripts/build-release.sh
            - name: Neues Release veröffentlichen
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(php -r '$c=json_decode(file_get_contents("composer.json"),true,512,JSON_THROW_ON_ERROR); echo $c["extra"]["mgd-release-version"];')
                  if gh release view "v$VERSION" >/dev/null 2>&1; then
                      echo "Version bereits veröffentlicht; vorhandene Assets bleiben erhalten."
                      exit 0
                  fi
                  gh release create "v$VERSION" "dist/MGDAIImageLabels-$VERSION.zip" --target "$GITHUB_SHA" --title "Version $VERSION" --generate-notes
